name: Regenerar hilo musical (manifest)

# Cuando se sueltan/quitan mp3s en admira-xp/music/ (o se editan los nombres en
# titles.json), regenera music/manifest.json. NO se dispara con manifest.json
# para no entrar en bucle con su propio commit.
on:
  push:
    branches: [ main ]
    paths:
      - 'admira-xp/music/*.mp3'
      - 'admira-xp/music/titles.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-manifest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar manifest
        run: node admira-xp/scripts/build-music-manifest.mjs
      - name: Commit si cambió
        run: |
          if git diff --quiet -- admira-xp/music/manifest.json; then
            echo "manifest sin cambios"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add admira-xp/music/manifest.json
            git commit -m "auto: regenera hilo musical (manifest.json)"
            git push
          fi
